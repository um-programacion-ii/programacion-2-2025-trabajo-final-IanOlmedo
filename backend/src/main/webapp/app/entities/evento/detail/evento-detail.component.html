<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (evento(); as eventoRef) {
      <div>
        <h2 data-cy="eventoDetailsHeading"><span jhiTranslate="gestionEventosApp.evento.detail.title">Evento</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ eventoRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="gestionEventosApp.evento.titulo">Titulo</span></dt>
          <dd>
            <span>{{ eventoRef.titulo }}</span>
          </dd>
          <dt><span jhiTranslate="gestionEventosApp.evento.fecha">Fecha</span></dt>
          <dd>
            <span>{{ eventoRef.fecha | formatMediumDate }}</span>
          </dd>
          <dt><span jhiTranslate="gestionEventosApp.evento.resumen">Resumen</span></dt>
          <dd>
            <span>{{ eventoRef.resumen }}</span>
          </dd>
          <dt><span jhiTranslate="gestionEventosApp.evento.precioEntrada">Precio Entrada</span></dt>
          <dd>
            <span>{{ eventoRef.precioEntrada }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Volver</span>
        </button>

        <button type="button" [routerLink]="['/evento', eventoRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Editar</span>
        </button>
      </div>
    }
  </div>
</div>
